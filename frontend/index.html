<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ses Defteri</title>
<link rel="icon" href="logo.svg" type="image/svg+xml">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="splash" role="status" aria-live="polite">
  <div class="sbox">
    <img class="sicon" src="loading.svg" alt="" width="150" height="150">
    <div class="slogo">Ses Defteri</div>
    <div class="stag"></div>
    <div class="sbar"><div class="sfill"></div></div>
    <div class="srow"><span class="smsg"></span><span class="spct">0%</span></div>
  </div>
</div>
<script src="splash.js"></script>
<script src="icons.js"></script>
<script src="skeleton.js"></script>
<aside id="sidenav" aria-label="Menü">
  <div class="navtop">
    <button id="navToggle" type="button" class="navham" data-icon="menu" data-i18n-title="menu"></button>
    <img class="hlogo" src="logo.svg" alt="" width="28" height="28"><h1 data-i18n="app">Ses Defteri</h1>
  </div>
  <nav class="navitems">
    <button id="homeBtn" class="navitem" data-icon="folder" data-i18n="all_recordings"></button>
    <button id="assistantBtn" class="navitem" data-icon="message-circle" data-i18n="assistant"></button>
    <button id="peopleBtn" class="navitem" data-icon="users" data-i18n="people"></button>
    <button id="settingsBtn" class="navitem" data-icon="sliders" data-i18n="settings"></button>
    <button id="sysBtn" class="navitem" data-icon="cpu" data-i18n="system">Sistem</button>
  </nav>
  <div class="navbottom">
    <span class="langwrap"><span class="langic" data-icon="globe" aria-hidden="true"></span><select id="langSel" data-i18n-title="language"><option value="tr">TR</option><option value="en">EN</option></select></span>
    <button id="aboutBtn" class="navitem" data-icon="info" data-i18n="about" data-i18n-title="about_title"></button>
  </div>
</aside>
<div id="updBar" class="updbar" role="status" aria-live="polite" hidden></div>
<div id="recBar" class="recbar" role="region" aria-live="polite" hidden></div>
<div id="meetBar" class="recbar meetbar" role="status" aria-live="polite" hidden></div>

<main id="home">
  <div id="drop" tabindex="0">
    <p class="big" data-i18n="drop"></p>
    <p><span data-i18n="or"></span> <a href="#" id="browseBtn" class="link" data-i18n="browse"></a></p>
    <p class="recrow"><button id="recBtn" type="button" class="primary" data-icon="mic" data-i18n="rec_start" data-i18n-title="rec_start_title"></button></p>
    <details id="optsBox" class="opts">
      <summary><span data-icon="settings" data-i18n="options"></span><span id="optsSum" class="hint"></span></summary>
      <div class="optsbody" role="dialog" aria-modal="true">
        <div class="optshead"><strong data-i18n="options"></strong>
          <button id="optsClose" type="button" class="small" data-icon="x" data-i18n="close"></button></div>
    <label class="toggle meetmode"><input type="checkbox" id="meetingMode"><span class="knob"></span><span data-i18n="meeting_mode"></span></label>
    <p class="hint meetmodehint" data-i18n="meeting_mode_hint"></p>
    <label class="toggle meetmode"><input type="checkbox" id="learnPeople"><span class="knob"></span><span data-i18n="learn_people"></span></label>
    <p class="hint meetmodehint" data-i18n="learn_people_hint"></p>
    <div id="watchBox">
      <label class="toggle meetmode"><input type="checkbox" id="watchOn"><span class="knob"></span><span data-i18n="watch_on"></span></label>
      <p class="hint meetmodehint" data-i18n="watch_hint"></p>
      <div class="watchrow"><button id="watchPick" type="button" class="small" data-icon="folder" data-i18n="watch_choose"></button>
        <span id="watchDir" class="hint"></span></div>
    </div>
    <label class="langmode"><span data-i18n="denoise_label"></span>
      <select id="denoiseMode"><option value="auto" data-i18n="dn_auto"></option><option value="off" data-i18n="dn_off"></option>
        <option value="always" data-i18n="dn_always"></option></select></label>
    <p class="hint meetmodehint" data-i18n="denoise_hint"></p>
    <label class="toggle meetmode"><input type="checkbox" id="denoiseAsk"><span class="knob"></span><span data-i18n="dn_ask"></span></label>
    <div class="watchrow"><span id="dnThr" class="hint"></span>
      <button id="dnReset" type="button" class="small" data-icon="refresh" data-i18n="dn_reset"></button></div>
    <label class="langmode"><span data-i18n="rec_language"></span>
      <select id="langMode"><option value="auto" data-i18n="rl_auto"></option><option value="mixed" data-i18n="rl_mixed"></option>
        <option value="tr" data-i18n="rl_tr"></option><option value="en" data-i18n="rl_en"></option></select></label>
      </div>
    </details>
  </div>
  <div id="watchInd" class="watchind" hidden><span data-icon="eye"></span><span id="watchIndText"></span></div>
  <div id="pnote" role="alert" hidden></div>
  <section id="progress" hidden>
    <div class="phead"><img class="pani" src="loading.svg" alt="" width="56" height="56"><div id="pname"></div></div>
    <div class="bar"><div id="pfill"></div></div>
    <div id="pstage"></div>
    <div id="pbtns">
      <button id="pPause" class="small" data-icon="pause" data-i18n="pause"></button>
      <button id="pResume" class="small primary" data-icon="play" data-i18n="resume" hidden></button>
      <button id="pCancel" class="small" data-icon="x" data-i18n="cancel_job"></button>
    </div>
    <div id="pqueue" hidden></div>
  </section>
  <div class="listhead">
    <h2><span data-i18n="prev_recordings"></span> <span id="jobCount"></span></h2>
    <div id="jobFilters">
      <input id="jq" type="search" data-i18n-ph="jq_ph">
      <button id="jSem" class="small" data-icon="sparkles" data-i18n="sem_toggle" data-i18n-title="sem_toggle_tip" aria-pressed="false"></button>
      <select id="jStatus">
        <option value="" data-i18n="all_statuses"></option><option value="done" data-i18n="st_done"></option>
        <option value="running" data-i18n="st_running"></option><option value="error" data-i18n="st_error"></option>
      </select>
      <select id="jLang"></select>
      <select id="jSort">
        <option value="new" data-i18n="sort_new"></option><option value="old" data-i18n="sort_old"></option>
        <option value="name" data-i18n="sort_name"></option><option value="long" data-i18n="sort_long"></option>
        <option value="short" data-i18n="sort_short"></option>
      </select>
    </div>
  </div>
  <div id="semBox" hidden></div>
  <ul id="jobs"></ul>
  <div id="jobsEmpty" hidden></div>
  <p class="credits" id="creditsLine"></p>
</main>

<main id="system" hidden></main>
<main id="people" hidden></main>
<main id="settings" hidden></main>
<main id="assistant" hidden></main>

<main id="view" hidden>
  <div class="toolbar">
    <h2 id="title"></h2>
    <span class="spacer"></span>
    <button id="undoBtn" class="icon" disabled data-icon="undo" data-i18n-title="undo_title"></button>
    <button id="helpBtn" class="icon" data-icon="keyboard" data-i18n-title="shortcuts_title"></button>
    <button id="wordBtn" class="primary wordbtn" data-icon="file-text" data-i18n="save_word" data-i18n-title="save_word_title"></button>
    <button id="minutesBtn" class="wordbtn" data-icon="clipboard-list" data-i18n="minutes_btn" data-i18n-title="minutes_btn_title"></button>
    <details class="menu" id="expMenu"><summary data-i18n="export"></summary>
      <div>
        <label><span data-i18n="version"></span>
          <select id="expVersion"><option value="edited" data-i18n="edited"></option><option value="original" data-i18n="original"></option><option value="both" data-i18n="both"></option><option value="analysis" data-i18n="export_analysis"></option></select></label>
        <label><span data-i18n="format"></span>
          <select id="expFmt"><option value="docx">Word (.docx)</option><option value="txt">TXT</option><option value="md">Markdown</option><option value="srt" data-i18n="srt"></option><option value="json">JSON</option></select></label>
        <div id="expWho"><div class="menulabel"><span data-i18n="only_who"></span> <span id="expWhoCount"></span></div><div id="expWhoList"></div>
          <div class="hint" data-i18n="only_who_hint"></div></div>
        <div id="expAnalysisHint" class="hint" data-i18n="export_analysis_hint" hidden></div>
        <button id="expGo" data-i18n="save_as"></button>
      </div>
    </details>
  </div>
  <div id="jobTabs" class="tabs">
    <button id="tabText" class="tab active" data-i18n="tab_text"></button>
    <button id="tabAnalysis" class="tab" data-i18n="tab_analysis"></button>
  </div>
  <p id="audioGone" class="hint audiogone" hidden data-i18n="audio_deleted"></p>
  <div id="paneText">
  <details id="chapters" class="chapters" hidden><summary id="chaptersSum"></summary><div id="chaptersList"></div></details>
  <div id="nameBox" class="namebox" hidden></div>
  <div id="speakers"></div>
  <div id="peopleAsk" class="peopleask" hidden></div>
  <div id="filters">
    <div class="searchbox">
      <input id="q" type="search" data-i18n-ph="q_ph">
      <span id="qCount"></span>
      <button id="qPrev" class="small icon" data-icon="chevron-up" data-i18n-title="prev_hit"></button>
      <button id="qNext" class="small icon" data-icon="chevron-down" data-i18n-title="next_hit"></button>
      <button id="repToggle" class="small icon" data-icon="replace" data-i18n-title="find_replace"></button>
    </div>
    <div class="searchbox" id="repBox" hidden>
      <input id="rep" data-i18n-ph="rep_ph">
      <button id="repAll" class="small" data-i18n="replace_all"></button>
    </div>
    <span class="spacer"></span>
    <select id="fSpk"></select>
    <details class="menu" id="fMenu"><summary id="fSum" data-i18n="filters"></summary>
      <div>
        <label class="chk"><input type="checkbox" id="fEdited"> <span data-i18n="edited_only"></span></label>
        <label class="chk"><input type="checkbox" id="fMatch"> <span data-i18n="matches_only"></span></label>
        <label class="chk"><input type="checkbox" id="follow" checked> <span data-i18n="follow"></span></label>
      </div>
    </details>
  </div>
  <div id="reviewBar" class="reviewbar" hidden>
    <span class="rvt" data-i18n="rv_title"></span>
    <span class="lcdot lc-mid-dot"></span><span data-i18n="rv_mid"></span>
    <span class="lcdot lc-low-dot"></span><span data-i18n="rv_low"></span>
    <button id="reviewOnly" class="small"></button>
    <span class="hint" data-i18n="rv_hint"></span>
  </div>
  <div id="segs"></div>
  <p id="empty" class="hint" hidden data-i18n="no_lines_filter"></p>
  </div>
  <div id="paneAnalysis" hidden></div>
</main>

<footer id="player" hidden>
  <audio id="audio" preload="auto"></audio>
  <button id="pp" class="icon" data-icon="play"></button>
  <button id="back">−5s</button><button id="fwd">+5s</button>
  <span id="clock">00:00:00</span>
  <select id="speed"><option value="0.75">0.75x</option><option value="1" selected>1x</option><option value="1.25">1.25x</option><option value="1.5">1.5x</option></select>
  <span id="saved"></span>
</footer>
<div id="selPop" hidden></div>
<div id="toast" hidden><span id="toastMsg"></span><button id="toastUndo" class="small" hidden></button></div>

<dialog id="help">
  <h3 data-i18n="shortcuts_title"></h3>
  <table>
    <tr><td><kbd>Ctrl</kbd>+<kbd>Space</kbd></td><td data-i18n="k_play"></td></tr>
    <tr><td><kbd>Ctrl</kbd>+<kbd>Enter</kbd></td><td data-i18n="k_line"></td></tr>
    <tr><td><kbd>Ctrl</kbd>+<kbd>F</kbd></td><td data-i18n="k_search"></td></tr>
    <tr><td><kbd>Enter</kbd> / <kbd>Shift</kbd>+<kbd>Enter</kbd></td><td data-i18n="k_next"></td></tr>
    <tr><td><kbd>Ctrl</kbd>+<kbd>Z</kbd></td><td data-i18n="k_undo"></td></tr>
    <tr><td><kbd>Alt</kbd>+<kbd data-icon="arrow-left"></kbd> / <kbd data-icon="arrow-right"></kbd></td><td data-i18n="k_seek"></td></tr>
    <tr><td><kbd>Esc</kbd></td><td data-i18n="k_esc"></td></tr>
  </table>
  <p class="hint helptip" data-i18n="tip"></p>
  <form method="dialog"><button data-i18n="close"></button></form>
</dialog>

<dialog id="abDlg">
  <h3 data-i18n="ab_title"></h3>
  <p class="hint" id="abDesc"></p>
  <div class="abrow">
    <button id="abPlayO" type="button" class="abplay" data-icon="play" data-i18n="ab_orig"></button>
    <button id="abPlayC" type="button" class="abplay" data-icon="play" data-i18n="ab_clean"></button>
  </div>
  <p class="hint" id="abInfo"></p>
  <label class="abdont"><input type="checkbox" id="abDont"> <span data-i18n="ab_dont"></span></label>
  <p class="hint" id="abTimer"></p>
  <div class="abchoose">
    <button id="abUseC" type="button" class="primary" data-icon="check" data-i18n="ab_use_clean"></button>
    <button id="abUseO" type="button" data-icon="check" data-i18n="ab_use_orig"></button>
  </div>
  <audio id="abAudO" preload="auto"></audio><audio id="abAudC" preload="auto"></audio>
</dialog>

<dialog id="aboutDlg">
  <h3 class="abouthead"><img src="logo.svg" alt="" width="40" height="40"><span data-i18n="app"></span></h3>
  <p class="hint" data-i18n="about_desc"></p>
  <p class="hint" id="aboutVer"></p>
  <table class="creditTable">
    <tr><td data-i18n="idea"></td><td>Umut Akbaş</td></tr>
    <tr><td data-i18n="developer"></td><td><a href="https://selimoguz.com.tr" class="ext">Selim Oğuz</a> <span data-i18n="and"></span> Claude</td></tr>
  </table>
  <p><button id="tourRestart" type="button" data-icon="refresh" data-i18n="tour_restart"></button></p>
  <form method="dialog"><button data-i18n="close"></button></form>
</dialog>
<dialog id="glossDlg" class="glossdlg">
  <div id="glossBody"></div>
  <form method="dialog"><button data-i18n="close"></button></form>
</dialog>
<dialog id="personDlg" class="glossdlg">
  <div id="personBody"></div>
</dialog>
<script src="i18n.js"></script>
<script src="app.js"></script>
<script src="nav.js"></script>
<script src="search.js"></script>
<script src="system.js"></script>
<script src="people.js"></script>
<script src="analysis.js"></script>
<script src="tour.js"></script>
<script src="updater.js"></script>
<script src="settings.js"></script>
<script src="recorder.js"></script>
<script src="chat.js"></script>
</body>
</html>
